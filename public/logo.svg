<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Fundo Arredondado (Squircle moderno) -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#bgGrad)" />
  <rect x="5" y="5" width="90" height="90" rx="24" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Detalhe do Relógio Interno -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#475569" stroke-width="6" stroke-dasharray="140 30" />
  
  <!-- Check / Ponteiro de Aderência -->
  <path d="M36 50 L46 60 L66 38" fill="none" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Ponto Central -->
  <circle cx="46" cy="60" r="3" fill="#10B981" />
</svg>
